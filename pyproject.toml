[project]
name = "wfmarket-sell-tool"
version = "0.1.0"
description = "personal tool developed in Python in order to have an easy way of checking the floor prices of multiple items"
authors = [{ name = "ktrin-u" }]
requires-python = "~=3.13"
readme = "README.md"
dependencies = [
    "requests>=2.32.3,<3",
    "asyncio>=3.4.3,<4",
    "aiohttp>=3.11.11,<4",
    "fastapi[standard]>=0.115.6,<0.116",
    "beautifulsoup4>=4.12.3,<5",
]

[tool.uv]
package = false

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
